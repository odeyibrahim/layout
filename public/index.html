<!doctype html>
<html lang="en" data-theme="dark">
<head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141311"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<title>Brand Studio</title>
<style>:root{
 --ink-950:#0E0D0B;--ink-900:#151410;--ink-850:#1B1A15;--ink-800:#211F1A;--ink-700:#2C2A24;--ink-600:#3A372F;
 --paper-50:#FBF9F3;--paper-100:#F3EFE5;--paper-200:#E8E2D3;--paper-300:#D6CFBD;
 --accent:#E0A63A;--accent-pressed:#C98F22;--accent-on:#14120F;--selection:#3D7BFF;--guide:#FF4D8D;--danger:#E5584A;--success:#4FB477;--warning:#E8B23A;
 --bg:var(--ink-950);--surface:var(--ink-900);--field:var(--ink-850);--raised:var(--ink-700);--line:var(--ink-600);--float:var(--ink-800);
 --tx:#F3EFE5;--tx2:#A9A394;
 --rail:56px;--insp-w:304px;--top:48px;--strip-h:96px;--dock:56px;--ctl:28px;--sheet-h:88px;
 --r-sm:6px;--r-md:10px;--r-lg:14px;--ease:cubic-bezier(.2,0,0,1);
 --ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme=light]{--bg:#E4DFD2;--surface:var(--paper-50);--field:#fff;--raised:var(--paper-200);--line:var(--paper-300);--float:#fff;--tx:#171612;--tx2:#625D50}
@media (pointer:coarse){:root{--ctl:44px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 13px/18px var(--ui);overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--selection);outline-offset:1px}

/* ---- shell: five regions, one grammar ---- */
#app{position:relative;display:grid;height:100dvh;grid-template-columns:var(--rail) minmax(0,1fr) var(--insp-w);grid-template-rows:var(--top) minmax(0,1fr) var(--strip-h);grid-template-areas:"top top top" "rail canvas insp" "strip strip strip"}
body.insp-off #app{grid-template-columns:var(--rail) minmax(0,1fr) 0}
body.insp-off #insp{display:none}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
#top .sp{flex:1}
#docname{background:transparent;border:1px solid transparent;border-radius:var(--r-sm);height:var(--ctl);padding:0 8px;min-width:60px;max-width:240px;font-weight:600;text-overflow:ellipsis}
#docname:hover,#docname:focus{border-color:var(--line);background:var(--field)}
#savestate{color:var(--tx2);font-size:11px;white-space:nowrap}
.ib{width:var(--ctl);height:var(--ctl);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-md);color:var(--tx2)}
.ib:hover{background:var(--raised);color:var(--tx)}.ib[disabled]{opacity:.35;pointer-events:none}.ib.on{background:var(--accent);color:var(--accent-on)}
.btn{height:var(--ctl);padding:0 12px;border-radius:var(--r-md);background:var(--raised);color:var(--tx);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn.pri{background:var(--accent);color:var(--accent-on)}.btn.pri:hover{background:var(--accent-pressed)}.btn[disabled]{opacity:.45;pointer-events:none}
.grp{display:flex;align-items:center;gap:2px}
#zoomVal{min-width:52px;font-variant-numeric:tabular-nums;color:var(--tx2)}
#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--surface);border-right:1px solid var(--line)}
#rail button{width:44px;height:48px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx2);font-size:10px;line-height:12px}
#rail button:hover{background:var(--raised);color:var(--tx)}
#rail button.on{background:var(--accent);color:var(--accent-on)}
#canvas{grid-area:canvas;position:relative;min-width:0;min-height:0;background:var(--bg)}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;user-select:none;-webkit-user-select:none}
#vp.pan{cursor:grab}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#pg{position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 60px rgba(0,0,0,.45);overflow:visible}
#pgguides{position:absolute;inset:0;pointer-events:none;z-index:99999}
.g-margin{position:absolute;border:1px dashed rgba(61,123,255,.55)}
.g-col{position:absolute;background:rgba(61,123,255,.07)}
.g-bleed{position:absolute;border:1px solid rgba(229,88,74,.6)}
.g-user{position:absolute;background:rgba(255,77,141,.7)}.g-user.v{top:0;bottom:0;width:1px}.g-user.h{left:0;right:0;height:1px}
.el{position:absolute;overflow:visible}
.el.text .ln{position:absolute;white-space:pre;left:0;top:0}
.el.text .rl{position:absolute;left:0;right:0;height:1px}
.el.image{overflow:hidden}.el.image img{width:100%;height:100%;display:block;pointer-events:none}
.ph{width:100%;height:100%;background:#d9d4c5;border:1.5px dashed #9d9684;color:#7b7565;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 11px var(--ui);text-align:center;padding:6px;overflow:hidden}
.ph.dk{background:#2b2923;border-color:#6a6556;color:#9a9484}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.sel-box{position:absolute;border:1.5px solid var(--selection);pointer-events:none}
.sel-box.multi{border-style:dashed}
.hd{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:1.5px solid var(--selection);border-radius:2px;pointer-events:auto;touch-action:none}
.hd::before{content:"";position:absolute;inset:-14px}
.hd.nw,.hd.se{cursor:nwse-resize}.hd.ne,.hd.sw{cursor:nesw-resize}.hd.n,.hd.s{cursor:ns-resize}.hd.e,.hd.w{cursor:ew-resize}
.gl{position:absolute;background:var(--guide);pointer-events:none}
.marq{position:absolute;border:1px solid var(--selection);background:rgba(61,123,255,.12);pointer-events:none}
#ctxbar{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;background:var(--float);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:auto;z-index:8;white-space:nowrap}
#ctxbar .ib{border-radius:999px}
#ctxbar .primary{padding:0 12px;height:var(--ctl);border-radius:999px;font-weight:600;color:var(--tx)}
#ctxbar .primary:hover{background:var(--raised)}
#editbox{position:absolute;pointer-events:auto;z-index:9;border:1.5px solid var(--selection);background:rgba(61,123,255,.08);resize:none;overflow:hidden;padding:0;margin:0;outline:none;white-space:pre-wrap}
#insp{grid-area:insp;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line);position:relative}
#sheetHandle{display:none}
#inspBody{overflow:auto;flex:1;padding:4px 0 24px}
.ttl{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-weight:600;font-size:15px;line-height:20px}
.sec{border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);cursor:pointer;min-height:var(--ctl)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .14s var(--ease)}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec .body{padding:0 14px 14px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row.r3{grid-template-columns:repeat(3,1fr)}.row.r1{grid-template-columns:1fr}
.nf{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);height:var(--ctl);min-width:0}
.nf .lb{padding:0 8px;color:var(--tx2);font-size:11px;cursor:ew-resize;user-select:none;touch-action:none;min-width:22px;text-align:center}
.nf input,.nf select{flex:1;min-width:0;width:100%;background:transparent;border:0;height:100%;padding:0 8px 0 0;font-variant-numeric:tabular-nums;text-align:right;outline:none}
.nf select{text-align:left;padding:0 6px}
.nf input[type=color]{padding:2px;height:calc(100% - 4px);margin:2px;border-radius:4px;flex:none;width:34px;background:none;border:0}
.nf:focus-within{border-color:var(--selection)}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;height:var(--ctl)}
.seg button{flex:1;color:var(--tx2);display:flex;align-items:center;justify-content:center;min-width:0}
.seg button.on{background:var(--raised);color:var(--tx)}
.chip{height:var(--ctl);padding:0 10px;border-radius:999px;background:var(--raised);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--accent-on)}
.muted{color:var(--tx2);font-size:12px;line-height:17px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid var(--line)}
@media (pointer:coarse){.sw{width:40px;height:40px}}
#flyout{position:absolute;z-index:20;display:none;flex-direction:column;background:var(--float);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(0,0,0,.45);overflow:hidden}
#flyout.open{display:flex}
#flyoutBody{overflow:auto;flex:1;padding-bottom:12px}
.tabs{display:flex;gap:4px;padding:0 10px 8px;overflow:auto}
.tabs button{height:30px;padding:0 10px;border-radius:999px;color:var(--tx2);font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--raised);color:var(--tx)}.tabs button[disabled]{opacity:.4}
.list{display:grid;gap:2px;padding:0 6px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);min-height:var(--ctl);cursor:pointer}
.li:hover{background:var(--raised)}.li.on{background:rgba(61,123,255,.18)}.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tg{color:var(--tx2);font-size:11px}
.gh{padding:10px 14px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px}
.card{background:var(--field);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:64px}
.card:hover{border-color:var(--tx2)}
textarea.brief{width:100%;min-height:150px;background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px;resize:vertical;font:12px/17px ui-monospace,Menlo,monospace}
#strip{grid-area:strip;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);overflow:hidden}
#stripList{display:flex;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;flex:1;height:100%;scrollbar-width:thin;padding:4px 2px}
.tile{flex:none;height:100%;position:relative;border-radius:6px;background:var(--field);display:flex;align-items:center;justify-content:center;padding:3px}
.tile canvas{display:block;max-height:100%;border-radius:3px}
.tile.on{outline:2px solid var(--accent);outline-offset:1px}
.tile .n{position:absolute;left:6px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;line-height:14px;border-radius:7px;padding:0 5px}
body.strip-off #app{grid-template-rows:var(--top) minmax(0,1fr) 0}body.strip-off #strip{display:none}
/* popovers, dialogs, toasts */
.pop{position:fixed;z-index:60;min-width:200px;max-width:min(320px,94vw);max-height:80dvh;overflow:auto;background:var(--float);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px}
.pop .hd2{padding:8px 10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.pop button{display:flex;width:100%;justify-content:space-between;gap:16px;align-items:center;text-align:left;padding:0 10px;min-height:var(--ctl);border-radius:var(--r-sm)}
.pop button:hover{background:var(--raised)}.pop button[disabled]{opacity:.4;pointer-events:none}.pop .k{color:var(--tx2);font-size:11px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
dialog{background:var(--float);color:var(--tx);border:1px solid var(--line);border-radius:var(--r-lg);padding:0;max-width:min(1100px,96vw);max-height:92dvh;box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
dialog .db{padding:14px;overflow:auto;max-height:calc(92dvh - 56px);display:grid;gap:12px}
dialog canvas{width:100%;height:auto;display:block;border-radius:var(--r-md);background:#000}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--float);border:1px solid var(--line);padding:8px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .14s var(--ease);max-width:92vw}
#toast.on{opacity:1}
.kbd{font:11px ui-monospace,monospace;color:var(--tx2)}
#palette{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding-top:12dvh;background:rgba(0,0,0,.5)}
#palette.on{display:flex}
#palette .box{width:min(520px,94vw);background:var(--float);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
#palette input{width:100%;height:48px;padding:0 14px;background:transparent;border:0;border-bottom:1px solid var(--line);outline:none;font-size:15px}
#palette .res{max-height:50dvh;overflow:auto;padding:4px}
#palette .res button{display:flex;justify-content:space-between;width:100%;padding:0 10px;min-height:40px;align-items:center;border-radius:var(--r-sm);text-align:left}
#palette .res button.on,#palette .res button:hover{background:var(--raised)}
#printRoot{display:none}
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block}html,body{overflow:visible!important;height:auto!important;background:#fff!important}.pp{break-after:page;position:relative;overflow:hidden}}

/* ---- phone: same regions, different containers ---- */
@media (max-width:719px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr) auto var(--sheet-h) var(--dock);grid-template-areas:"top" "canvas" "strip" "insp" "rail"}
 body.insp-off #app{grid-template-columns:minmax(0,1fr)}body.insp-off #insp{display:flex}
 #strip{height:72px;padding:6px 8px}body.strip-off #app{grid-template-rows:var(--top) minmax(0,1fr) 0 var(--sheet-h) var(--dock)}
 #rail{flex-direction:row;justify-content:space-around;padding:0 4px;border-right:0;border-top:1px solid var(--line);height:var(--dock);align-items:center}
 #rail button{width:auto;flex:1;height:100%;border-radius:0}
 #insp{border-left:0;border-top:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;transition:none}
 #sheetHandle{display:flex;justify-content:center;align-items:center;height:22px;touch-action:none;cursor:grab;flex:none}
 #sheetHandle::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line)}
 #flyout{position:static;grid-area:insp;border-radius:var(--r-lg) var(--r-lg) 0 0;border:0;border-top:1px solid var(--line);box-shadow:none;z-index:20;left:auto!important;top:auto!important;width:auto!important;max-height:none!important;height:auto!important}
 .zoomgrp,#docname{display:none}#top{gap:4px}
 #savestate{display:none}
 #ctxbar{max-width:96vw}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.lowpower *{backdrop-filter:none!important}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <button class="ib" id="menuBtn" aria-label="Menu" title="Menu"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M4 7h16M4 12h16M4 17h16'/></svg></button>
  <div class="grp"><button class="ib" id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z)"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M9 14L4 9l5-5'/><path d='M4 9h10a6 6 0 010 12h-3'/></svg></button><button class="ib" id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M15 14l5-5-5-5'/><path d='M20 9H10a6 6 0 000 12h3'/></svg></button></div>
  <input id="docname" aria-label="Project name" value="Untitled project" maxlength="80">
  <span id="savestate" aria-live="polite"></span>
  <span class="sp"></span>
  <div class="grp zoomgrp"><button class="ib" id="zoomOut" aria-label="Zoom out"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M5 12h14'/></svg></button><button class="ib" id="zoomVal" aria-label="Zoom level">100%</button><button class="ib" id="zoomIn" aria-label="Zoom in"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 5v14M5 12h14'/></svg></button><button class="ib" id="fitBtn" aria-label="Fit page" title="Fit (Shift+1)"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4'/></svg></button></div>
  <button class="btn pri" id="exportBtn"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3v12'/><path d='M7 8l5-5 5 5'/><path d='M5 14v5h14v-5'/></svg><span>Export</span></button>
 </header>
 <nav id="rail" aria-label="Tools">
  <button data-panel="select" class="on" aria-label="Select"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M6 3l12 8-5.5 1.5L10 18z'/></svg><span>Select</span></button>
  <button data-panel="add" aria-label="Add"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 5v14M5 12h14'/></svg><span>Add</span></button>
  <button data-panel="layers" aria-label="Layers"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3l9 5-9 5-9-5z'/><path d='M3 13l9 5 9-5'/></svg><span>Layers</span></button>
  <button data-panel="brand" aria-label="Brand"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3a9 9 0 100 18c1.5 0 2-1 1.4-2.2-.6-1.2.2-2.3 1.6-2.3H17a4 4 0 004-4c0-5-4-9.5-9-9.5z'/><circle cx='7.5' cy='11' r='1'/><circle cx='11' cy='7' r='1'/><circle cx='16' cy='8' r='1'/></svg><span>Brand</span></button>
  <button data-panel="overview" aria-label="Overview"><svg class='i' viewBox='0 0 24 24' aria-hidden='true'><rect x='4' y='4' width='7' height='7' rx='1.5'/><rect x='13' y='4' width='7' height='5' rx='1.5'/><rect x='4' y='13' width='7' height='7' rx='1.5'/><rect x='13' y='11' width='7' height='9' rx='1.5'/></svg><span>Overview</span></button>
 </nav>
 <main id="canvas"><div id="vp"></div></main>
 <aside id="insp" aria-label="Inspector"><div id="sheetHandle" role="separator" aria-label="Resize panel"></div><div id="inspBody"></div></aside>
 <div id="flyout" role="dialog" aria-label="Panel"></div>
 <footer id="strip" aria-label="Pages"><div id="stripList"></div></footer>
</div>
<div id="toast" role="status"></div>
<div id="palette"><div class="box"><input id="palIn" placeholder="Type a command…" aria-label="Command"><div class="res" id="palRes"></div></div></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileOpen" accept=".ray,.json,application/json" hidden>

  <details class="sec" open><summary>Brief</summary><div class="body"><textarea class="brief" id="briefTx" spellcheck="false" aria-label="Brief"></textarea><div class="row"><button class="btn" id="briefCheck">Check</button><button class="btn pri" id="briefBuild">Build kit</button></div><div id="briefRep" class="muted"></div><button class="btn" id="briefRegen"${page().rk ? '' : ' disabled'}>Regenerate this page</button></div></details>`;
}
function brandMount(b) {
  const tx = $('#briefTx', b); tx.value = briefText();
  const run = build => { const r = parseBrief(tx.value); const rep = $('#briefRep', b); rep.innerHTML = (r.issues.length ? r.issues.map(i => '• ' + esc(i)).join('<br>') : '• Brief looks complete.'); if (!build || !r.brief) return;
    if (S.doc.pages.some(p => p.els.length) && !confirm('Build a new project from this brief? It replaces the current project (you can reopen it from your autosave only until you edit).')) return;
    rep.innerHTML += '<br>Building…'; setTimeout(async () => { try { const res = await buildKit(r.brief); rep.innerHTML = `• Built ${res.pages} pages.${res.overflow ? ' ' + res.overflow + ' text boxes overflow their frame.' : ' No text overflow.'}${res.warnings.length ? '<br>• ' + esc(res.warnings.join('; ')) : ''}`; toast(res.pages + ' pages built'); } catch (e) { rep.textContent = 'Build failed: ' + e.message; } }, 30); };
  $('#briefCheck', b).onclick = () => run(false); $('#briefBuild', b).onclick = () => run(true); $('#briefRegen', b).onclick = regeneratePage;

  const txJ = () => { try { return JSON.parse($('#briefTx', b).value); } catch (e) { return {}; } };
  const txS = o => { $('#briefTx', b).value = JSON.stringify(o, null, 1); };
  const markOn = o => { $$('#flyoutBody [data-ind]', b).forEach(x => { const t = x.querySelector('.tg'); if (t) t.textContent = x.dataset.ind === (o.industry || 'none') ? '✓' : ''; }); };
  const sampleBrief = id => { const I = IND_BY_ID[id]; return { name: (IND_SAMPLE[id] || {}).n || 'Sample & Co', tagline: I.tag, subtitle: I.desc, city: 'Lagos, Nigeria', cta: I.cta, contact: { email: 'hello@your-domain.com', phone: '+234 000 000 0000', web: 'your-domain.com', social: '@' + id }, palette: (IND_PAL[id] || []).slice(), fonts: { head: I.style.d, body: I.style.b }, industry: id, pattern: IND_PAT[I.style.p] }; };
  $$('#flyoutBody [data-ind]', b).forEach(ch => ch.onclick = () => { let o = txJ(); const ind = ch.dataset.ind; if (ind === 'none') { delete o.industry; } else { o.industry = ind; const s = sampleBrief(ind); ['tagline', 'subtitle', 'cta'].forEach(k => o[k] = s[k]); o.palette = s.palette; o.fonts = s.fonts; o.pattern = s.pattern; if (!o.name) o.name = s.name; if (!o.contact) o.contact = s.contact; if (!o.city) o.city = s.city; } txS(o); markOn(o); toast('Industry set — press Build kit to generate'); });
  const mL = $('#markL', b), mS = $('#markS', b), pS = $('#patSel', b);
  if (mL) mL.oninput = e => { const o = txJ(); o.mark = Object.assign({}, o.mark || {}, { letters: e.target.value.toUpperCase().slice(0, 2) }); txS(o); };
  if (mS) mS.onchange = e => { const o = txJ(); o.mark = Object.assign({}, o.mark || {}, { style: e.target.value }); txS(o); };
  if (pS) pS.onchange = e => { const o = txJ(); o.pattern = e.target.value; txS(o); };
  const mu = $('#markUp', b);
  if (mu) mu.onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/svg+xml,image/png,image/jpeg'; inp.onchange = async () => { const f = inp.files[0]; if (!f) return; const id = await addAssetBlob(f); const o = txJ(); o.mark = Object.assign({}, o.mark || {}, { img: id }); txS(o); toast('Mark uploaded — press Build kit'); }; inp.click(); };
  const dk2 = $('#deckOpen2', b); if (dk2) dk2.onclick = openDeck;
}
function initPanels() {
  const f = $('#flyout');
  f.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) return openPanel('select'); const t = e.target.closest('[data-tab]'); if (t && !t.disabled) { S.addTab = t.dataset.tab; return renderPanel(); }
    const sw = e.target.closest('[data-sw]'); if (sw) { const c = sw.dataset.sw, l = selEls(); if (l.length) edit('Apply colour', () => l.forEach(x => { if (x.type === 'text') x.props.color = c; else if (x.type !== 'image') x.props.fill = c; })); else editPage('Backdrop', p => p.bg = c); return; }
    const lk = e.target.closest('[data-lock]'); if (lk) { const el = byId(lk.dataset.lock); if (el) edit(el.locked ? 'Unlock' : 'Lock', () => el.locked = !el.locked); e.stopPropagation(); return; }
    const ly = e.target.closest('[data-layer]'); if (ly) { const id = ly.dataset.layer; e.shiftKey || S.multi ? toggleSel(id) : select([id]); return; }
    const ad = e.target.closest('[data-add]'); if (ad) { const [k, v] = ad.dataset.add.split(':'); if (k === 'text') A.addText(v); else if (k === 'shape') { if (v === 'pen' || v === 'brush') DRAWUI.start(v); else A.addShape(v); } else if (k === 'image') v === 'slot' ? A.addImageSlot() : A.uploadImage(); else if (k === 'tpl') addTemplate(v); if (isPhone() && k !== 'tpl') setDetent('half'); }
  });
}
function addTemplate(id) {
  let r; try { r = KitX.pageFor(id, S.doc.meta.brief || undefined); } catch (e) { return toast('Could not build that page: ' + e.message); } if (!r || !r.page) return toast('Template not found');
  const q = r.page; q.rk.h = hashEls(q.els); loadFont(r.brief.fonts.head); loadFont(r.brief.fonts.body); const at = S.cur + 1;
  struct('Add page from template', () => { S.doc.pages.splice(at, 0, q); S.cur = at; S.sel = []; }, () => { S.doc.pages.splice(at, 1); S.cur = clamp(at - 1, 0, S.doc.pages.length - 1); S.sel = []; }); toast('Added "' + q.name + '"');
}

/* ---------- pages strip ---------- */
let thumbQueue = [];
function renderStrip() {
  const L = $('#stripList'); L.innerHTML = '';
  S.doc.pages.forEach((p, i) => {
    const t = document.createElement('div'); t.className = 'tile' + (i === S.cur ? ' on' : ''); t.dataset.i = i; t.tabIndex = 0; t.setAttribute('role', 'button'); t.setAttribute('aria-label', 'Page ' + (i + 1) + ': ' + p.name);
    const cv = document.createElement('canvas'); const h = 78, w = clamp(Math.round(h * p.w / p.h), 40, 220); cv.width = w * 2; cv.height = Math.round(w * 2 * p.h / p.w); cv.style.width = w + 'px'; cv.style.height = Math.round(w * p.h / p.w) + 'px'; t.appendChild(cv);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1; t.appendChild(n); L.appendChild(t); thumbQueue.push(i);
  });
  const add = document.createElement('button'); add.className = 'tile'; add.style.cssText = 'width:44px;color:var(--tx2)'; add.setAttribute('aria-label', 'Add page'); add.innerHTML = ICONS.plus; add.dataset.add = 1; L.appendChild(add);
  const mm = document.createElement('button'); mm.className = 'tile'; mm.style.cssText = 'width:44px;color:var(--tx2)'; mm.setAttribute('aria-label', 'Page menu'); mm.innerHTML = ICONS.more; mm.dataset.pm = 1; L.appendChild(mm);
  pumpThumbs(); const on = $('.tile.on', L); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function paintThumb(i) { const t = $(`#stripList .tile[data-i="${i}"]`); if (!t) return; const cv = $('canvas', t), p = S.doc.pages[i]; if (!p) return; const src = thumbCanvas(p, cv.width), c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); c.drawImage(src, 0, 0, cv.width, cv.height); }
function pumpThumbs() { if (!thumbQueue.length) return; const t0 = performance.now(); while (thumbQueue.length && performance.now() - t0 < 10) paintThumb(thumbQueue.shift()); if (thumbQueue.length) { if (window.requestIdleCallback) requestIdleCallback(pumpThumbs, { timeout: 200 }); else setTimeout(pumpThumbs, 30); } }
let thumbT = 0; function refreshCurThumb() { clearTimeout(thumbT); thumbT = setTimeout(() => { const i = S.cur; if (S.doc.pages[i]) { thumbQueue.unshift(i); pumpThumbs(); } }, 350); }
function initStrip() {
  const L = $('#stripList');
  L.addEventListener('click', e => { const t = e.target.closest('.tile'); if (!t) return; if (t.dataset.add) return A.addPage(); if (t.dataset.pm) { const r = t.getBoundingClientRect(); return pageMenu(r.left, r.top - 260); } A.go(+t.dataset.i); });
  L.addEventListener('contextmenu', e => { const t = e.target.closest('.tile[data-i]'); if (!t) return; e.preventDefault(); A.go(+t.dataset.i); pageMenu(e.clientX, e.clientY - 200); });
  L.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const t = e.target.closest('.tile[data-i]'); if (t) { e.preventDefault(); A.go(+t.dataset.i); } } });
}

/* ---------- sheet detents (phone) ---------- */
const DET = { peek: () => 96, half: () => Math.round(innerHeight * .42), full: () => Math.round(innerHeight * .74) };
function setDetent(n) { S.detent = n; document.documentElement.style.setProperty('--sheet-h', DET[n]() + 'px'); setTimeout(() => { if (S.fitMode) fitView(); else centerOnSelection(); renderOverlay(); }, 30); }
function initSheet() {
  const h = $('#sheetHandle'); let st = null;
  const startDrag = e => { if (!isPhone()) return; st = { y: e.clientY, h: parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sheet-h')) || DET.peek(), moved: false }; e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if (!st) return; const dy = e.clientY - st.y; if (Math.abs(dy) > 3) st.moved = true; document.documentElement.style.setProperty('--sheet-h', clamp(st.h - dy, 72, innerHeight * .8) + 'px'); };
  const end = e => { if (!st) return; const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sheet-h')); const moved = st.moved; st = null; if (!moved) { setDetent(S.detent === 'peek' ? 'half' : S.detent === 'half' ? 'full' : 'peek'); return; } const n = Object.keys(DET).reduce((a, k) => Math.abs(DET[k]() - cur) < Math.abs(DET[a]() - cur) ? k : a, 'peek'); setDetent(n); };
  h.addEventListener('pointerdown', startDrag); h.addEventListener('pointermove', move); h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  const fl = $('#flyout'); fl.addEventListener('pointerdown', e => { if (isPhone() && e.target.closest('.ttl') && !e.target.closest('button')) { startDrag.call({}, Object.assign(e, { currentTarget: fl })); } }); fl.addEventListener('pointermove', move); fl.addEventListener('pointerup', end);
  matchMedia('(max-width:719px)').addEventListener('change', () => { setDetent(S.detent || 'peek'); if (!isPhone()) document.documentElement.style.removeProperty('--sheet-h'); closeFlyoutLayout(); });
}
function closeFlyoutLayout() { if (S.panel) { const f = $('#flyout'); if (!isPhone()) { f.style.left = 'calc(var(--rail) + 10px)'; f.style.top = 'calc(var(--top) + 10px)'; f.style.width = '316px'; f.style.maxHeight = 'calc(100dvh - var(--top) - var(--strip-h) - 24px)'; } } }

/* ---------- keyboard ---------- */
function initKeys() {
  document.addEventListener('keydown', e => {
    const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName) || t.isContentEditable; const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === 'k') { e.preventDefault(); return openPalette(); } if (typing) { if (e.key === 'Escape') t.blur(); return; } if ($('#dlg').open || $('#palette').classList.contains('on')) return;
    if (mod && k === 'z') { e.preventDefault(); flushLive(); return e.shiftKey ? redo() : undo(); } if (mod && k === 'y') { e.preventDefault(); return redo(); } if (mod && k === 's') { e.preventDefault(); return saveRay(); }
    if (mod && k === 'd') { e.preventDefault(); return A.duplicate(); } if (mod && k === 'a') { e.preventDefault(); return A.selectAll(); }
    if (e.key === ' ') { D.space = true; VP.el.classList.add('pan'); e.preventDefault(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return A.remove(); } if (e.key === 'Escape') { select([]); return; } if (e.key === 'Enter' && S.sel.length === 1) { const el = byId(S.sel[0]); if (el && el.type === 'text') { e.preventDefault(); startEdit(el); } return; }
    const st = e.shiftKey ? .1 : .01; if (e.key === 'ArrowLeft') { e.preventDefault(); A.nudge(-st, 0); } if (e.key === 'ArrowRight') { e.preventDefault(); A.nudge(st, 0); } if (e.key === 'ArrowUp') { e.preventDefault(); A.nudge(0, -st); } if (e.key === 'ArrowDown') { e.preventDefault(); A.nudge(0, st); }
    if (e.key === ']') A.order('up'); if (e.key === '[') A.order('down'); if (e.key === '+' || e.key === '=') { S.fitMode = false; zoomAt(1.2); } if (e.key === '-') { S.fitMode = false; zoomAt(1 / 1.2); } if (e.key === '!' || (e.shiftKey && e.key === '1')) fitView();
  });
  document.addEventListener('keyup', e => { if (e.key === ' ') { D.space = false; VP.el.classList.remove('pan'); } });
}

/* ===== main ===== */
/* main: wiring and boot */
function updateUndo() { $('#undoBtn').disabled = !H.undo.length; $('#redoBtn').disabled = !H.redo.length; }
function updateSaveState() { const m = { saved: 'Saved', saving: 'Saving…', offline: 'Not saved (storage unavailable)' }; $('#savestate').textContent = m[S.saved] || ''; }
function boot() {
  const nv = navigator; if ((nv.deviceMemory && nv.deviceMemory <= 2) || (nv.hardwareConcurrency && nv.hardwareConcurrency <= 2) || (nv.connection && nv.connection.saveData)) document.body.classList.add('lowpower');
  const fl = document.createElement('link'); fl.rel = 'stylesheet'; fl.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap'; document.head.appendChild(fl);
  initEditor($('#vp')); initInspector(); initPanels(); initStrip(); initSheet(); initKeys();
  $('#menuBtn').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); mainMenu(r.left, r.bottom + 6); };
  $('#undoBtn').onclick = () => { flushLive(); undo(); }; $('#redoBtn').onclick = redo; $('#exportBtn').onclick = exportDialog; $('#fitBtn').onclick = () => fitView();
  $('#zoomIn').onclick = () => { S.fitMode = false; zoomAt(1.25); }; $('#zoomOut').onclick = () => { S.fitMode = false; zoomAt(.8); }; $('#zoomVal').onclick = () => { S.fitMode = false; S.zoom = 1; applyView(); };
  $('#docname').oninput = e => { S.doc.meta.name = e.target.value; changed('save'); };
  $$('#rail button').forEach(b => b.onclick = () => openPanel(b.dataset.panel));
  $('#fileOpen').onchange = e => { const f = e.target.files[0]; if (f) openRayFile(f); e.target.value = ''; };
  const dz = $('#canvas'); dz.addEventListener('dragover', e => e.preventDefault());
  dz.addEventListener('drop', async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return; if (/\.(ray|json)$/i.test(f.name)) return openRayFile(f); if (/^image\//.test(f.type)) { const id = await addAssetBlob(f); const el = hitEl(document.elementFromPoint(e.clientX, e.clientY) || e.target); if (el && el.type === 'image') edit('Set image', () => el.props.asset = id); else addEl('image', { asset: id }, { w: 3.2, h: 2.2 }); } });
  on('flush', f => {
    if (f.has('pages')) { renderStrip(); }
    if (f.has('pagesel')) { $$('#stripList .tile[data-i]').forEach(t => t.classList.toggle('on', +t.dataset.i === S.cur)); const on = $('#stripList .tile.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    if (f.has('stage') || f.has('fit')) renderStage();
    if (f.has('fit')) fitView();
    if (f.has('ov') || f.has('stage') || f.has('fit')) renderOverlay();
    if (f.has('insp')) renderInspector();
    if (f.has('layers') && S.panel) renderPanel();
    if (f.has('thumb')) refreshCurThumb();
    if (f.has('save')) scheduleSave();
  });
  on('history', updateUndo); on('savestate', updateSaveState); on('selection', () => { if (S.sel.length) setTimeout(centerOnSelection, 0); });
  on('docloaded', () => { $('#docname').value = S.doc.meta.name; document.title = S.doc.meta.name + ' · Brand Studio'; });
  addEventListener('beforeunload', () => { flushLive(); });
  addEventListener('resize', () => { if (S.fitMode) fitView(); else renderOverlay(); });
  updateUndo(); updateSaveState(); S.fitMode = true;
  (async () => {
    const raw = await idbGet('kv', 'doc'); let restored = false;
    if (raw) { try { const o = JSON.parse(raw); loadDoc(validate(o.doc)); restored = true; toast('Restored your last session'); } catch (e) { } }
    if (!restored) { changed('stage', 'insp', 'pages', 'fit'); emit('docloaded'); buildKit({ name: 'Your Brand', tagline: 'Made with care' }).then(() => toast('Sample kit ready. Open Brand to make it yours.')).catch(() => setTimeout(() => { openPanel('brand'); }, 200)); }
    S.saved = 'saved'; emit('savestate');
  })();
  setDetent('peek');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
